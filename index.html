<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DishDash</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛵</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Rubik:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <button class="logo" id="logo-btn" aria-label="DishDash home">
        <span class="logo-mark" aria-hidden="true">🛵</span>Dish<em>Dash</em>
      </button>
      <button class="address-btn" id="address-btn" aria-label="Change delivery address">
        📍 <span id="address-label">1420 Maple Ave</span> <span class="caret">▼</span>
      </button>
      <div class="search-wrap">
        <span aria-hidden="true">🔍</span>
        <input id="search-input" type="search" placeholder="Search restaurants, dishes, cuisines…" aria-label="Search restaurants and dishes">
      </div>
      <button class="header-link" id="orders-link">Orders</button>
      <button class="cart-btn" id="cart-open" aria-label="Open cart">
        🛒 Cart <span class="cart-count num" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <main class="view" id="view"></main>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>

  <footer class="footer">
    <strong>DishDash</strong> — a demo food-delivery app. No real restaurants, orders, or charges.
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
